version: v2
clean: true
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    revision: 1
    include_imports: true
    out: gen/ts
    opt: target=ts
